[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labpilot"
version = "0.1.0"
description = "Experiment-centric Research Agent OS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<0.31",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "orjson>=3.10,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
  "uvicorn[standard]>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "architecture: verifies module dependency rules",
  "destructive: creates and drops an isolated PostgreSQL database",
  "native: requires the dedicated native Slice 2 acceptance host",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["labpilot"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
