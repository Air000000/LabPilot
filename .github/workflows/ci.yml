name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LABPILOT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/labpilot_ci
      LABPILOT_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      LABPILOT_ENVIRONMENT: test
      LABPILOT_INSTALLATION_IDENTITY: ci-installation
      LABPILOT_LOCAL_ACTOR_ID: ci-local-user
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local-equivalent CI gate
        run: ./scripts/check_ci.sh
      - name: Verify production image runtime dependencies
        env:
          LABPILOT_CI_IMAGE: labpilot-ci:${{ github.sha }}
        run: |
          docker build --tag "$LABPILOT_CI_IMAGE" .
          docker run --rm \
            --entrypoint /bin/sh \
            "$LABPILOT_CI_IMAGE" \
            -ceu '
              test -x /usr/bin/git
              test "$(command -v git)" = /usr/bin/git
              /usr/bin/git --version
            '
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            "$LABPILOT_CI_IMAGE" \
            -c 'from pathlib import Path; from labpilot.context.git_adapter import GitAdapter; GitAdapter(git_executable=Path("/usr/bin/git"), timeout_seconds=1)'
