services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: labpilot
      POSTGRES_PASSWORD: labpilot
      POSTGRES_DB: labpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labpilot -d labpilot"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - labpilot_pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    restart: "no"
    environment: &app-env
      LABPILOT_DATABASE_URL: postgresql+asyncpg://labpilot:labpilot@postgres:5432/labpilot
      LABPILOT_ENVIRONMENT: development
      LABPILOT_INSTALLATION_IDENTITY: ${LABPILOT_INSTALLATION_IDENTITY:-local-development}
      LABPILOT_LOCAL_ACTOR_ID: ${LABPILOT_LOCAL_ACTOR_ID:-local-user}
      LABPILOT_REPOSITORY_ALLOWED_ROOTS: '${LABPILOT_REPOSITORY_ALLOWED_ROOTS:-["/repositories"]}'
      LABPILOT_REPOSITORY_CONTENT_STORE_ROOT: /var/lib/labpilot/content
    command: ["sh", "-c", "python scripts/wait_for_postgres.py && python scripts/run_migrations.py"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *app-env
      LABPILOT_DATA_EGRESS_POLICY: ${LABPILOT_DATA_EGRESS_POLICY:-local_only}
      LABPILOT_AGENT_PROVIDER_MODEL: ${LABPILOT_AGENT_PROVIDER_MODEL:-}
      LABPILOT_AGENT_PROVIDER_API_KEY: ${LABPILOT_AGENT_PROVIDER_API_KEY:-}
    command: ["uvicorn", "labpilot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${LABPILOT_API_PORT:-8000}:8000"
    volumes:
      - ${LABPILOT_REPOSITORY_HOST_ROOT:-.}:/repositories:ro
      - labpilot_content:/var/lib/labpilot/content
      - type: bind
        source: ${LABPILOT_ATTEMPT_WORKSPACE_ROOT:?LABPILOT_ATTEMPT_WORKSPACE_ROOT is required}
        target: ${LABPILOT_ATTEMPT_WORKSPACE_ROOT:?LABPILOT_ATTEMPT_WORKSPACE_ROOT is required}
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  coordinator:
    build: .
    environment:
      <<: *app-env
      LABPILOT_ATTEMPT_WORKSPACE_ROOT: ${LABPILOT_ATTEMPT_WORKSPACE_ROOT:?LABPILOT_ATTEMPT_WORKSPACE_ROOT is required}
      LABPILOT_RUNNER_SOCKET_PATH: /run/labpilot-runner/control.sock
      LABPILOT_RUNNER_REQUEST_TIMEOUT_SECONDS: ${LABPILOT_RUNNER_REQUEST_TIMEOUT_SECONDS:-10}
      LABPILOT_UNKNOWN_ATTENTION_GRACE_SECONDS: ${LABPILOT_UNKNOWN_ATTENTION_GRACE_SECONDS:-60}
      LABPILOT_CONTROLLER_UID: ${LABPILOT_CONTROLLER_UID:?LABPILOT_CONTROLLER_UID is required}
      LABPILOT_CONTROLLER_GID: ${LABPILOT_CONTROLLER_GID:?LABPILOT_CONTROLLER_GID is required}
      LABPILOT_TRAIN_GID: ${LABPILOT_TRAIN_GID:?LABPILOT_TRAIN_GID is required}
    user: "${LABPILOT_CONTROLLER_UID:?LABPILOT_CONTROLLER_UID is required}:${LABPILOT_CONTROLLER_GID:?LABPILOT_CONTROLLER_GID is required}"
    group_add:
      - "${LABPILOT_TRAIN_GID:?LABPILOT_TRAIN_GID is required}"
    command: ["python", "-m", "labpilot.coordinator.worker"]
    volumes:
      - ${LABPILOT_REPOSITORY_HOST_ROOT:-.}:/repositories:ro
      - labpilot_content:/var/lib/labpilot/content
      - "${LABPILOT_ATTEMPT_WORKSPACE_ROOT:?LABPILOT_ATTEMPT_WORKSPACE_ROOT is required}:${LABPILOT_ATTEMPT_WORKSPACE_ROOT:?LABPILOT_ATTEMPT_WORKSPACE_ROOT is required}"
      - type: bind
        source: /run/labpilot-runner
        target: /run/labpilot-runner
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  projection:
    profiles: ["advanced-ops"]
    build: .
    environment: *app-env
    command: ["python", "-m", "labpilot.observability.projection_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  labpilot_pgdata:
  labpilot_content:
